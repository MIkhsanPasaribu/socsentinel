# ============================================================
# SOCsentinel — Production Docker Compose
# ============================================================
# Runs backend with ChromaDB persistent volume.
# Frontend is built into the backend container (multi-stage).
# ============================================================

services:
  socsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - ENVIRONMENT=production
      - LLM_PROVIDER=mock
      - CHROMA_PERSIST_DIR=./data/chroma_db
      - LOG_LEVEL=INFO
      - FRONTEND_URL=*
      # For AMD MI300X production:
      # - LLM_PROVIDER=vllm
      # - VLLM_API_BASE=http://<mi300x-ip>:8000/v1
    volumes:
      - chroma_data:/app/data/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma_data:
    driver: local
